name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches:
      - main
      - 'release/**'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend: ['backend/**']
            frontend: ['frontend/**']
            e2e: ['e2e/**']

  backend-test:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Backend image (for testing)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          load: true
          tags: backend-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: false
          no-cache: true
      - name: Run Backend Tests
        run: |
          rm -f backend/coverage.xml
          docker run --rm \
            -v $(pwd)/backend:/backend \
            -w /backend \
            backend-test:latest pytest --cov=app --cov-report=xml:coverage.xml
      - name: Fix coverage paths for SonarCloud
        run: |
          sed -i 's|<source>/backend/app</source>|<source>backend/app</source>|g' backend/coverage.xml
      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
      - name: SonarCloud Scan (Backend)
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.sources=backend/app
            -Dsonar.python.coverage.reportPaths=backend/coverage.xml
            -Dsonar.projectBaseDir=.

  frontend-test:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Test
        run: cd frontend && npm run coverage
      - name: SonarCloud Scan (Frontend)
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.sources=frontend/src
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

  e2e-test:
    needs: [changes, backend-test, frontend-test]
    if: |
      always() &&
      (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.e2e == 'true') &&
      (needs.backend-test.result == 'success' || needs.backend-test.result == 'skipped') &&
      (needs.frontend-test.result == 'success' || needs.frontend-test.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start Docker Compose Services
        run: |
          docker compose --profile test up -d --build backend frontend nginx

      - name: Wait for services to be ready
        run: |
          echo "Waiting for backend API to be healthy..."
          for i in {1..30}; do
            if curl -s http://localhost/api/health | grep -q "ok"; then
              echo "Application services are ready and online!"
              break
            fi
            echo "Still loading... retrying in 2 seconds (Attempt $i/30)..."
            sleep 2
          done

      - name: Run Playwright Tests inside Docker
        run: |
          docker compose --profile test run --no-deps --rm e2e

      - name: Upload Playwright Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30

      - name: Stop Services
        if: always()
        run: docker compose --profile test down
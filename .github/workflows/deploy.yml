name: Deploy to AWS

on:
  workflow_run:
    workflows: ["CI Pipeline"] 
    types:
      - completed

jobs:
  filter:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' && 
      github.event.workflow_run.head_branch == 'main' &&
      toJson(github.event.workflow_run.pull_requests) == '[]'
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend: ['backend/**']
            frontend: ['frontend/**']

  build-and-push:
    needs: filter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build/Push Backend
        if: needs.filter.outputs.backend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/project-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build/Push Frontend
        if: needs.filter.outputs.frontend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/project-frontend:latest
          build-args: |
            VITE_API_URL=/api
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}

  deploy-to-aws:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
      - name: Copy docker-compose to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml, nginx/nginx.conf" 
          target: "~/app"

      - name: Deploy to AWS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/app
            docker compose down
            
            export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
            export DATABASE_URL="${{ secrets.DATABASE_URL }}"
            export SECRET_KEY="${{ secrets.SECRET_KEY }}"
            
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            
            docker compose pull
            docker compose up -d

      - name: Wait for AWS environment to be healthy
        run: |
          echo "Waiting for live AWS application to be ready..."
          for i in {1..30}; do
            if curl -s http://${{ secrets.SERVER_IP }}/api/health | grep -q "ok"; then
              echo "Production application is online and ready for smoke tests!"
              break
            fi
            echo "Waiting for app to respond... retrying in 2 seconds (Attempt $i/30)..."
            sleep 2
          done

      - name: Run E2E Production Smoke Test
        run: |
          docker compose --profile test run \
            -e BASE_URL=http://${{ secrets.SERVER_IP }} \
            --no-deps \
            --rm e2e

      - name: Upload Playwright Test Report (Smoke Test)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: e2e/playwright-report/
          retention-days: 30